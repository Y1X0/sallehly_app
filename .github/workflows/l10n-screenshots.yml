name: L10N Screenshots

# CI-only infrastructure (no app code touched): captures a real PNG for
# every screen/locale/width combo in test/support/l10n_screen_cases.dart,
# rendered with a real Arabic+Latin font instead of flutter test's default
# placeholder font, so layout/RTL issues can actually be reviewed visually.
on:
  workflow_dispatch:
  push:
    branches: [ claude/flutter-ui-consistency-vzb65s ]
    paths:
      - '.github/workflows/l10n-screenshots.yml'
      - 'test/widgets/l10n_screenshot_capture_test.dart'
      - 'test/support/l10n_screen_cases.dart'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Install real fonts (Noto, via apt — not a project asset)
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-core fonts-noto-extra fontconfig
          ARABIC=$(find /usr/share/fonts -iname "*NotoNaskhArabic*Regular*" 2>/dev/null | head -1)
          if [ -z "$ARABIC" ]; then
            ARABIC=$(find /usr/share/fonts -iname "*NotoSansArabic*Regular*" 2>/dev/null | head -1)
          fi
          LATIN=$(find /usr/share/fonts -iname "NotoSans-Regular.ttf" 2>/dev/null | head -1)
          LATIN_BOLD=$(find /usr/share/fonts -iname "NotoSans-Bold.ttf" 2>/dev/null | head -1)
          if [ -z "$ARABIC" ] || [ -z "$LATIN" ]; then
            echo "::error::Missing a real font after apt install (arabic=$ARABIC latin=$LATIN)"
            find /usr/share/fonts -iname "*noto*" | sort
            exit 1
          fi
          PATHS="$LATIN:$ARABIC"
          if [ -n "$LATIN_BOLD" ]; then PATHS="$PATHS:$LATIN_BOLD"; fi
          echo "REAL_FONT_PATHS=$PATHS" >> "$GITHUB_ENV"
          echo "Using fonts: $PATHS"

      - name: Run screenshot capture test (all screens/locales/widths)
        env:
          SCREENSHOT_OUT_DIR: build/l10n_screenshots
        run: flutter test test/widgets/l10n_screenshot_capture_test.dart --reporter expanded

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: l10n-screenshots
          path: build/l10n_screenshots/*.png
          retention-days: 14
          if-no-files-found: error

      # Actions-artifact downloads go through Azure Blob Storage, which this
      # session's egress proxy can't reach — pushing to a branch lets review
      # happen over plain `git`/github.com instead. Force-pushed each run;
      # this branch holds only the latest screenshots, not history.
      - name: Publish screenshots to a review branch (git-fetchable, not just the zip artifact)
        run: |
          set -e
          git config user.name "l10n-screenshots-ci"
          git config user.email "noreply@github.com"
          rm -rf /tmp/screenshots_publish
          mkdir -p /tmp/screenshots_publish
          cp build/l10n_screenshots/*.png /tmp/screenshots_publish/
          git checkout --orphan l10n-screenshots-latest
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/screenshots_publish/*.png .
          git add ./*.png
          git commit -m "L10N screenshots from run ${{ github.run_id }}"
          git push origin HEAD:l10n-screenshots-latest --force
