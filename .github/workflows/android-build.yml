name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get packages
        run: flutter pub get

      # --no-fatal-infos: flutter analyze exits non-zero on ANY issue by
      # default, including info-level lint suggestions (there are 11
      # pre-existing ones in this project, e.g. deprecated_member_use,
      # unnecessary_underscores). Only real problems (errors/warnings)
      # should fail CI; --fatal-warnings (default) still applies.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # --exclude-tags screenshot: l10n_screenshot_capture_test.dart needs a
      # real font installed via a separate CI step (l10n-screenshots.yml) —
      # without it, its setUpAll throws immediately and fails the whole run.
      # That file is CI/QA infrastructure, not a correctness test; it's
      # exercised by its own dedicated workflow instead.
      - name: Test
        run: flutter test --exclude-tags screenshot

      # Reconstructs android/key.properties + the .jks keystore from repo
      # secrets at build time — neither is ever committed (see
      # android/.gitignore, android/key.properties.example). Runs only when
      # ANDROID_KEYSTORE_BASE64 is actually configured as a repo secret; a
      # fork's pull_request run (no secret access by GitHub design) or this
      # repo before the secret is set both fall through to the debug-signed
      # validation build below instead — never to a silently-broken signing
      # attempt.
      - name: Set up Android release signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/sallehly-release.jks"
          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/android/app/sallehly-release.jks
          EOF

      # Real, Play-Store-signable artifact — only produced when the signing
      # secrets above were actually available this run.
      - name: Build Android App Bundle (release-signed)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: flutter build appbundle --release

      - name: Upload App Bundle (release-signed)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sallehly-android-aab-release-signed
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      # Fallback only: no android/key.properties in CI (secret not
      # configured for this run — e.g. a fork's PR). The release build type
      # falls back to debug signing when key.properties is absent, so this
      # only validates that the app compiles; it is not a Play-Store-ready
      # artifact and must not be uploaded as one.
      - name: Build Android App Bundle (CI validation only, debug-signed)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: flutter build appbundle --release

      - name: Upload App Bundle (debug-signed, validation only)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sallehly-android-aab-unsigned
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      # [FIX-L10N-QA-01] .aab وحده لا يُثبَّت مباشرة على جهاز (يحتاج bundletool
      # لاستخراج .apks منه أولاً) — أُضيف بناء APK صريح لتمكين فحص بصري يدوي
      # سريع (تثبيت مباشر بالجهاز) لتغييرات الترجمة/RTL-LTR بدون أي أداة وسيطة.
      - name: Build Android APK (debug, for manual install/QA)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sallehly-android-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
