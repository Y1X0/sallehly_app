name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    # `secrets` is not a recognized named-value inside a step-level `if:`
    # expression (confirmed directly: manually dispatching this workflow
    # before this fix failed validation at parse time — "Unrecognized
    # named-value: 'secrets'" — before any job could even start). Routing
    # it through a job-level env var first works: `env` *is* available in
    # `if:`. This single check below is then reused by every gated step.
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get packages
        run: flutter pub get

      # --no-fatal-infos: flutter analyze exits non-zero on ANY issue by
      # default, including info-level lint suggestions (there are 11
      # pre-existing ones in this project, e.g. deprecated_member_use,
      # unnecessary_underscores). Only real problems (errors/warnings)
      # should fail CI; --fatal-warnings (default) still applies.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # --exclude-tags screenshot: l10n_screenshot_capture_test.dart needs a
      # real font installed via a separate CI step (l10n-screenshots.yml) —
      # without it, its setUpAll throws immediately and fails the whole run.
      # That file is CI/QA infrastructure, not a correctness test; it's
      # exercised by its own dedicated workflow instead.
      - name: Test
        run: flutter test --exclude-tags screenshot

      # Reconstructs android/key.properties + the .jks keystore from repo
      # secrets at build time — neither is ever committed (see
      # android/.gitignore, android/key.properties.example). Runs only when
      # ANDROID_KEYSTORE_BASE64 is actually configured as a repo secret; a
      # fork's pull_request run (no secret access by GitHub design) or this
      # repo before the secret is set both fall through to the debug-signed
      # validation build below instead — never to a silently-broken signing
      # attempt.
      # A missing/misnamed secret used to resolve silently to an empty
      # string and only surface ~2 minutes later as an opaque Gradle
      # keystore error ("tampered with, or password was incorrect") — that's
      # exactly what happened with ANDROID_STORE_PASSWORD vs. the actual
      # secret name ANDROID_KEYSTORE_PASSWORD. Fail fast here instead, with
      # the real secret name in the message, before spending any build time.
      - name: Verify required signing secrets are present
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$ANDROID_KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$ANDROID_KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty required secret(s):$missing — check Settings -> Secrets and variables -> Actions. Not falling through to a broken signing attempt."
            exit 1
          fi
          echo "All required signing secrets are present."

      - name: Set up Android release signing
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/sallehly-release.jks"
          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/android/app/sallehly-release.jks
          EOF

      # Real, Play-Store-signable artifact — only produced when the signing
      # secrets above were actually available this run.
      - name: Build Android App Bundle (release-signed)
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        run: flutter build appbundle --release

      - name: Upload App Bundle (release-signed)
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sallehly-android-aab-release-signed
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      # Fallback only: no android/key.properties in CI (secret not
      # configured for this run — e.g. a fork's PR). The release build type
      # falls back to debug signing when key.properties is absent, so this
      # only validates that the app compiles; it is not a Play-Store-ready
      # artifact and must not be uploaded as one.
      - name: Build Android App Bundle (CI validation only, debug-signed)
        if: ${{ env.HAS_RELEASE_KEYSTORE != 'true' }}
        run: flutter build appbundle --release

      - name: Upload App Bundle (debug-signed, validation only)
        if: ${{ env.HAS_RELEASE_KEYSTORE != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sallehly-android-aab-unsigned
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      # [FIX-L10N-QA-01] .aab وحده لا يُثبَّت مباشرة على جهاز (يحتاج bundletool
      # لاستخراج .apks منه أولاً) — أُضيف بناء APK صريح لتمكين فحص بصري يدوي
      # سريع (تثبيت مباشر بالجهاز) لتغييرات الترجمة/RTL-LTR بدون أي أداة وسيطة.
      - name: Build Android APK (debug, for manual install/QA)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sallehly-android-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
