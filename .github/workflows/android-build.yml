name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get packages
        run: flutter pub get

      # --no-fatal-infos: flutter analyze exits non-zero on ANY issue by
      # default, including info-level lint suggestions (there are ~16
      # pre-existing ones in this project, e.g. deprecated_member_use,
      # unnecessary_underscores). Only real problems (errors/warnings)
      # should fail CI; --fatal-warnings (default) still applies.
      #
      # [SEC-FIX-CTXLINT-01] راجع DECISIONS.md — استثناء واحد متعمَّد: قاعدة
      # `use_build_context_synchronously` مرفوعة لـ`error` صراحة بـ
      # analysis_options.yaml رغم أن severity الافتراضية لكل قواعد lint هي
      # INFO. هذا يجعلها قاتلة هنا رغم --no-fatal-infos — انهيار BuildContext
      # بعد await فئة أخطاء حقيقية (SEC-FIX-CTXAWAIT-01/02)، لا ملاحظة
      # أسلوبية، ولا يستحق نفس الإعفاء.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # --exclude-tags screenshot: l10n_screenshot_capture_test.dart needs a
      # real font installed via a separate CI step (l10n-screenshots.yml) —
      # without it, its setUpAll throws immediately and fails the whole run.
      # That file is CI/QA infrastructure, not a correctness test; it's
      # exercised by its own dedicated workflow instead.
      - name: Test
        run: flutter test --exclude-tags screenshot

      # No android/key.properties in CI (release keystore is not committed,
      # by design — see android/app/build.gradle.kts). The release build
      # type falls back to debug signing when key.properties is absent, so
      # this validates that the app actually builds; it is not a
      # Play-Store-ready artifact and must not be uploaded as one.
      #
      # A real, production-signed AAB is produced by the separate, manual
      # -only "Build Signed Android Release (AAB)" workflow
      # (android-release-signed.yml, see android/SIGNING.md) — deliberately
      # kept out of this one so an ordinary push/PR never touches the
      # signing secrets, and so there is exactly one place that knows how
      # to sign a release instead of two copies that can drift apart.
      - name: Build Android App Bundle (CI validation only, debug-signed)
        run: flutter build appbundle --release

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: sallehly-android-aab-unsigned
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      # [FIX-L10N-QA-01] .aab وحده لا يُثبَّت مباشرة على جهاز (يحتاج bundletool
      # لاستخراج .apks منه أولاً) — أُضيف بناء APK صريح لتمكين فحص بصري يدوي
      # سريع (تثبيت مباشر بالجهاز) لتغييرات الترجمة/RTL-LTR بدون أي أداة وسيطة.
      - name: Build Android APK (debug, for manual install/QA)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sallehly-android-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
