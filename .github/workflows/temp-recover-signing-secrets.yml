name: "TEMP: Recover Android Signing Credentials"

# ONE-TIME USE, DELETE AFTER DOWNLOADING THE RESULT.
#
# This exists solely to recover the plaintext values of the Android release
# signing credentials, which currently exist only inside GitHub Secrets
# (write-only — nobody, including repo admins, can read a secret's value
# back through the GitHub UI/API once it's saved). It decodes the keystore,
# writes the passwords/alias in plain text, and runs `keytool -list -v` for
# the fingerprints/expiry — then uploads all of it as one downloadable
# artifact.
#
# The artifact this produces contains real, unmasked secret values. Do not
# leave this workflow in the repo, and do not leave the artifact/run sitting
# in GitHub after you've downloaded and safely stored the result — see the
# chat instructions for exact cleanup steps.

on:
  workflow_dispatch:

jobs:
  recover-credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore and write credentials/fingerprints
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          OUT="$RUNNER_TEMP/recovery"
          mkdir -p "$OUT"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$OUT/sallehly-release.jks"

          cat > "$OUT/credentials.txt" <<EOF
          # Android release signing credentials — recovered $(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Store this in a password manager, then delete this file.
          ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS
          EOF

          keytool -list -v -keystore "$OUT/sallehly-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            > "$OUT/fingerprints.txt" 2>&1 || echo "keytool exited non-zero — check fingerprints.txt for details" >> "$OUT/fingerprints.txt"

          cat > "$OUT/README.txt" <<'EOF'
          This is your Android app-signing key and its credentials, recovered from
          GitHub Secrets because no local/offline copy existed.

          Contents:
            sallehly-release.jks  - the actual signing keystore (binary)
            credentials.txt       - storePassword / keyPassword / keyAlias, plain text
            fingerprints.txt      - keytool -list -v output (SHA1/SHA256 fingerprints, validity)

          Losing this keystore or its passwords permanently blocks future updates
          to the same Google Play listing (unless Play App Signing is enabled and
          you go through Google's upload-key-reset process). Store this somewhere
          durable and offline: a password manager for credentials.txt's values, and
          at least one other secure location (e.g. an encrypted drive, or a second
          device) for sallehly-release.jks itself.

          Once you've copied everything out safely, delete this artifact and this
          workflow file from the repo — it exists only for this one recovery.
          EOF

      - name: Upload recovery bundle
        uses: actions/upload-artifact@v4
        with:
          name: signing-credentials-RECOVERY-DELETE-ASAP
          path: ${{ runner.temp }}/recovery
          retention-days: 1
